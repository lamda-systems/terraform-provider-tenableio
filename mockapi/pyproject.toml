[project]
name = "tenableio-mock"
version = "1.0.0"
description = "In-memory fake of the Tenable.io API for testing the Terraform provider"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[project.scripts]
tenableio-mock = "tenableio_mock.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tenableio_mock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
